<!-- 
    Sitemap Page (Site Index)
    Renders all main sections and database articles vertically below one another, 
    forming a highly accessible, complete directory.
    All sitemap and link styling is centralized in css/style.css.
-->
<main class="dashboard-section u-mt-3">
    <header class="archive-page-header u-mb-3">
        <span class="archive-kicker">Navigation Directory</span>
        <h1>Sitemap</h1>
        <p class="u-text-muted">A complete vertical index of all sections and articles available in the archive database.</p>
    </header>

    <!-- 
        Sitemap Vertical Stack Container
        Displays each category and index section directly below one another
        for straightforward linear scanning. Styled entirely in css/style.css.
    -->
    <div id="sitemap-container" class="sitemap-list-stack">
        <!-- Dynamically populated by DossierManager.renderSitemap() -->
        <div class="u-text-center u-p-3">
            <p>Loading sitemap index...</p>
        </div>
    </div>
</main>
