<div class="home-viewport archive-home" id="home-viewport" data-static-archive="true">
    <section class="home-layer hero-layer archive-frontdesk" id="hero-layer">
        <div class="hero-map-overlay"></div>
        <div class="hero-main-container">
            <div class="hero-content">
                <span class="archive-kicker">Independent Research Archive</span>
                <h1>The Great Awakening</h1>
                <p>A curated public-record index for institutional reports, declassified files, geopolitical dossiers, and source-traceable research notes.</p>
            </div>

            <div class="hero-search-wrapper">
                <label class="u-sr-only" for="dossier-search">Search dossiers</label>
                <input
                    type="text"
                    id="dossier-search"
                    class="search-input-pill"
                    placeholder="Search for dossiers (e.g. Agenda 2030, WEF)..."
                    autocomplete="off"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    aria-controls="home-search-suggestions"
                >
                <div id="home-search-suggestions" class="search-suggestions" hidden></div>
            </div>

            <!-- 
                Archive Highlights Information Panel
                Displays institutional database metrics and operational metadata 
                regarding the current intelligence collection and standard index methods.
            -->
            <div class="archive-frontdesk-meta" aria-label="Archive highlights">
                <div>
                    <span class="meta-label">Collection</span>
                    <strong>Dossier Database</strong>
                </div>
                <div>
                    <span class="meta-label">Method</span>
                    <strong>Primary-Source Index</strong>
                </div>
                <div>
                    <span class="meta-label">Access</span>
                    <strong>Open Access</strong>
                </div>
            </div>
        </div>

        <a class="scroll-indicator archive-jump-link" id="home-scroll-trigger" href="#home/1">
            <span class="scroll-text">View All Articles</span>
            <div class="scroll-arrow">
                <svg id="indicator-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
                </svg>
            </div>
        </a>
    </section>

    <!-- 
        Featured Records Layer
        Renders a dynamically populated grid preview of high-priority index dossiers.
    -->
    <section class="home-layer dashboard-layer archive-preview-layer" id="dashboard-layer">
        <main class="dashboard-section" id="dashboard-section">
            <div class="dashboard-back-strip">
                <span>Featured Articles</span>
            </div>
            <div id="home-dossier-list" class="dossier-list">
                <!-- Dynamically populated by DossierManager -->
            </div>
        </main>
    </section>
</div>
